[package]
name = "quote-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
quote-security = { path = "../quote-security" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
quote-diagnostics = { path = "../quote-diagnostics" }
quote-core = { path = "../quote-core" }
quote-ledger = { path = "../quote-ledger" }
quote-excel = { path = "../quote-excel" }
serde.workspace = true
serde_json.workspace = true
rusqlite = { workspace = true, features = ["functions"] }
sha2.workspace = true
getrandom.workspace = true
base64.workspace = true
time = { workspace = true, features = ["parsing"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
axum-server = { version = "=0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
scrypt = { version = "=0.11.0", default-features = false }
hmac = "=0.12.1"
subtle = "=2.6.1"
fs2 = "=0.4.3"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem"] }
fontdue = "=0.9.3"
png = "=0.18.1"
rpassword = "=7.4.0"
num-bigint.workspace = true
form_urlencoded = "=1.2.2"
hyper-util = { version = "=0.1.21", features = ["server-auto", "http1", "tokio"] }
