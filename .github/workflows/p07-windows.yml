name: P07 Windows Tauri desktop
on:
  push:
    branches: [stage/p07-tauri-desktop, stage/p08-cutover]
  pull_request:
    branches: [stage/p07-tauri-desktop, stage/p08-cutover]
  workflow_dispatch:
    inputs:
      verify_installers:
        description: 'Explicitly run manager/sales installer verification'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: p07-windows-${{ github.ref }}${{ contains(github.event.head_commit.message, '[host-checks]') && '-host-checks' || '' }}
  cancel-in-progress: true
jobs:
  host-sync:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Validate focused host-check scope
        if: ${{ contains(github.event.head_commit.message, '[host-checks]') }}
        shell: pwsh
        run: |
          $changed = @(git diff --name-only HEAD^ HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot determine focused check scope' }
          $allowed = '^(tools/p08_sync[^/]*\.py|tests/test_p08_[^/]*\.py|docs/now/[^/]*\.md|docs/verification/P08-02-[^/]*\.(md|json|log)|\.gitignore|\.github/workflows/p07-windows\.yml)$'
          if (@($changed | Where-Object { $_ -notmatch $allowed }).Count) { throw 'HOST_CHECK_MARKER_REQUIRES_TEST_OR_DOC_ONLY_DIFF' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Native host prerequisites
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed' }
          python -m pip install -r requirements-baseline.txt -r requirements-service.txt
          if ($LASTEXITCODE -ne 0) { throw 'Host verification dependencies failed' }
      - name: Check host Rust formatting
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
      - name: Native cluster protocol and strict analysis
        if: ${{ !contains(github.event.head_commit.message, '[host-checks]') }}
        shell: pwsh
        run: |
          cargo clippy --locked -j 2 -p quote-host -p quote-security --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Host Clippy failed' }
          cargo test --locked -j 2 -p quote-host -p quote-security
          if ($LASTEXITCODE -ne 0) { throw 'Cluster protocol tests failed' }
      - name: Build native host resources from source
        shell: pwsh
        run: |
          cargo build --locked --release -j 2 -p quote-host -p quote-ledger
          if ($LASTEXITCODE -ne 0) { throw 'Native hosts failed to build' }
      - name: Two real TLS nodes and interrupted replication
        shell: pwsh
        run: |
          python tools/p08_sync_check.py --output reports/p08-02-sync
          if ($LASTEXITCODE -ne 0) { throw 'Two-node replication failed' }
      - name: Real primary TLS offline application and developer resolution
        if: ${{ !contains(github.event.head_commit.message, '[host-checks]') }}
        shell: pwsh
        run: |
          python tools/p08_application_check.py --output reports/p08-02-3-C-application
          if ($LASTEXITCODE -ne 0) { throw 'Primary offline application checks failed' }
      - name: Upload primary application evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p08-02-3-C-application-evidence
          path: reports/p08-02-3-C-application
          if-no-files-found: warn
      - name: Upload cluster evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p08-02-sync-evidence
          path: reports/p08-02-sync
          if-no-files-found: warn
  offline-orders:
    if: ${{ !contains(github.event.head_commit.message, '[host-checks]') }}
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Pinned native runtime prerequisites
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed' }
          python -m pip install -r requirements-baseline.txt -r requirements-service.txt
          if ($LASTEXITCODE -ne 0) { throw 'Native verification dependencies failed' }
      - name: Strict desktop analysis and Windows local transaction, protection and startup tests
        shell: pwsh
        run: |
          cargo clippy --locked -j 2 -p quote-desktop --lib --examples --features verification,manager -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Local order strict analysis failed' }
          cargo test --locked -j 2 -p quote-desktop --lib --features verification,manager
          if ($LASTEXITCODE -ne 0) { throw 'Windows local order tests failed' }
      - name: Build real runtime IPC drivers and Host resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path reports/p08-02-3-D-drivers -Force | Out-Null
          cargo build --locked --release -j 2 -p quote-host -p quote-ledger
          if ($LASTEXITCODE -ne 0) { throw 'Native Host build failed' }
          foreach ($role in @('manager','sales')) {
            cargo build --locked -j 2 -p quote-desktop --example offline-bridge --features "verification,$role"
            if ($LASTEXITCODE -ne 0) { throw "Native $role driver build failed" }
            Copy-Item target/debug/examples/offline-bridge.exe "reports/p08-02-3-D-drivers/$role.exe"
          }
      - name: Real TLS stop, offline saves, process restart and independent silent upload
        shell: pwsh
        run: |
          python tools/p08_local_check.py --manager reports/p08-02-3-D-drivers/manager.exe --sales reports/p08-02-3-D-drivers/sales.exe --output reports/p08-02-3-D-local
          if ($LASTEXITCODE -ne 0) { throw 'Native offline order data flow failed' }
      - name: Upload local order evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p08-02-3-D-local-orders-evidence
          path: reports/p08-02-3-D-local
          if-no-files-found: warn
  desktop-contracts:
    if: ${{ !contains(github.event.head_commit.message, '[host-checks]') }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Pinned MSVC Rust and isolated verification dependencies
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          python -m pip install -r requirements-baseline.txt -r requirements-service.txt
          if ($LASTEXITCODE -ne 0) { throw 'Verification dependencies failed' }
      - name: Runner and owned native window lifecycle regression
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_p07_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Runner regression failed' }
      - name: P08 deployment policy and PowerShell syntax
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_p08_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'P08 deployment policy failed' }
          Get-ChildItem deployment/windows -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Windows build, real Rust HTTPS, browser and actual Tauri WebView2 lifecycle
        shell: pwsh
        run: |
          python tools/p07_desktop_check.py --ci-checks --jobs 2 --output reports/p07-01-ci
          if ($LASTEXITCODE -ne 0) { throw 'P07 desktop checks failed' }
      - name: Customer orders, editable revisions and monthly financial reports
        shell: pwsh
        run: |
          python tools/p07_customer_orders_check.py --output reports/p07-07-ci
          if ($LASTEXITCODE -ne 0) { throw 'P07-07 native customer order checks failed' }
      - name: P08 production supervisor shutdown channel
        shell: pwsh
        run: |
          python tools/p08_host_check.py --output reports/p08-02-host
          if ($LASTEXITCODE -ne 0) { throw 'P08 native supervisor check failed' }
          python tools/p08_bundle_check.py --output reports/p08-02-bundle
          if ($LASTEXITCODE -ne 0) { throw 'P08 SDK-free host bundle check failed' }
      - name: Runtime diagnostics retain actual Windows IO errors
        shell: pwsh
        run: |
          python tools/p07_diagnostics_check.py
          if ($LASTEXITCODE -ne 0) { throw 'Runtime diagnostics failed' }
      - name: Developer source switching, daily dual-format backup and recovery
        shell: pwsh
        run: |
          cargo build --locked -p quote-desktop --example developer-bridge -j 2
          if ($LASTEXITCODE -ne 0) { throw 'Developer IPC driver build failed' }
          python tools/p07_developer_check.py --output reports/p07-06-ci
          if ($LASTEXITCODE -ne 0) { throw 'Developer source/backup checks failed' }
      - name: Actual SMB mapped drive, hidden folders and selected junction paths
        shell: pwsh
        run: |
          python tools/p07_paths_check.py --output reports/p07-06-paths
          if ($LASTEXITCODE -ne 0) { throw 'Selected filesystem path checks failed' }
      - name: Upload isolated evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p07-01-windows-evidence
          path: |
            reports/p07-01-ci
            reports/p07-02-ci
            reports/p07-06-ci
            reports/p07-06-paths
            reports/p07-07-ci
            reports/p08-02-host
            reports/p08-02-bundle
            desktop/test-results
          if-no-files-found: warn
  device-presentation:
    if: ${{ !contains(github.event.head_commit.message, '[host-checks]') }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Pinned MSVC Rust and isolated verification dependencies
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          python -m pip install -r requirements-baseline.txt -r requirements-service.txt
          if ($LASTEXITCODE -ne 0) { throw 'Verification dependencies failed' }
      - name: Device identity, manager/sales presentation and complete quote images
        shell: pwsh
        run: |
          python tools/p07_presentation_check.py --windows-smoke --jobs 2 --output reports/p07-03-ci
          if ($LASTEXITCODE -ne 0) { throw 'P07-03 presentation checks failed' }
      - name: Upload isolated presentation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p07-03-windows-evidence
          path: reports/p07-03-ci
          if-no-files-found: warn
  installers:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_installers }}
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        delivery: [manager, sales]
    env:
      PYTHONUTF8: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Pinned release prerequisites
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_p07_package_enrollment.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell enrollment regression failed' }
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed' }
          python -m pip install -r requirements-baseline.txt -r requirements-service.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python setup failed' }
          npm --prefix desktop ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Frontend setup failed' }
          npm --prefix desktop run fonts:prepare
          if ($LASTEXITCODE -ne 0) { throw 'Pinned font setup failed' }
          cargo build --locked --release -j 2 -p quote-host -p quote-ledger
          if ($LASTEXITCODE -ne 0) { throw 'Isolated host build failed' }
          npm --prefix desktop run build
          if ($LASTEXITCODE -ne 0) { throw 'Developer UI build failed' }
          cargo build --locked -p quote-desktop -j 2
          if ($LASTEXITCODE -ne 0) { throw 'Developer debug window build failed' }
      - name: Actual role installer, upgrade, retained profiles and compatible rollback
        shell: pwsh
        run: |
          python tools/p07_package_check.py --delivery ${{ matrix.delivery }} --jobs 2 --output reports/p07-04-${{ matrix.delivery }}
          if ($LASTEXITCODE -ne 0) { throw 'Actual installer lifecycle failed' }
      - name: Upload compact developer UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p07-05-${{ matrix.delivery }}-developer-ui
          path: reports/p07-04-${{ matrix.delivery }}/developer-ui
          if-no-files-found: warn
      - name: Upload isolated installer evidence and test packages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p07-04-${{ matrix.delivery }}-isolated-installers
          path: reports/p07-04-${{ matrix.delivery }}
          if-no-files-found: warn
