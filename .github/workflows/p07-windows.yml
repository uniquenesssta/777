name: P07 Windows Tauri desktop
on:
  push:
    branches: [stage/p07-tauri-desktop]
  pull_request:
    branches: [stage/p07-tauri-desktop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p07-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop-contracts:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Pinned MSVC Rust and isolated verification dependencies
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          python -m pip install -r requirements-baseline.txt -r requirements-service.txt
          if ($LASTEXITCODE -ne 0) { throw 'Verification dependencies failed' }
      - name: Runner progress, interruption and command-plan regression
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_p07_check_runner.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Runner regression failed' }
      - name: Windows build, real Rust HTTPS and browser interaction
        shell: pwsh
        run: |
          python tools/p07_desktop_check.py --ci-checks --jobs 2 --output reports/p07-01-ci
          if ($LASTEXITCODE -ne 0) { throw 'P07 desktop checks failed' }
      - name: Upload isolated evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p07-01-windows-evidence
          path: |
            reports/p07-01-ci
            desktop/test-results
          if-no-files-found: warn
