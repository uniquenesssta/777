[workspace]
members = ["crates/quote-core", "crates/quote-ledger", "crates/quote-excel", "crates/quote-host"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.97.1"
license = "Apache-2.0"

[workspace.dependencies]
num-bigint = "=0.4.6"
num-integer = "=0.1.46"
num-traits = "=0.2.19"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }

rusqlite = { version = "=0.37.0", features = ["bundled", "backup"] }
sha2 = "=0.10.9"
getrandom = "=0.2.16"
time = { version = "=0.3.44", features = ["formatting"] }
base64 = "=0.22.1"
quick-xml = "=0.41.0"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
rust_xlsxwriter = { version = "=0.99.1", default-features = false }
