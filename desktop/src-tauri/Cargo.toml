[package]
name = "quote-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[features]
default = []
verification = []
[dependencies]
quote-core = { path = "../../crates/quote-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
getrandom.workspace = true
base64.workspace = true
x509-parser = { version = "=0.18.1", features = ["verify"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
[target.'cfg(windows)'.dependencies]
tauri = { version = "=2.12.3", default-features = false, features = ["wry", "compression", "common-controls-v6"] }
[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "=2.7.2" }

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem"] }
